name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install Foxguard
        run: cargo install foxguard --version 0.12.0 --locked
      - name: Scan current files and Git history
        shell: bash
        run: |
          set -euo pipefail
          foxguard secrets .
          audit_dir="$(mktemp -d)"
          trap 'rm -rf -- "$audit_dir"' EXIT
          git log --all --format=fuller --no-patch > "$audit_dir/commits.txt"
          while read -r commit; do
            mkdir "$audit_dir/$commit"
            git archive "$commit" | tar -x -C "$audit_dir/$commit"
          done < <(git rev-list --all)
          foxguard secrets "$audit_dir" --max-file-size 20000000
