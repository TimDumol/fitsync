[project]
name = "garmin-fitness-sync"
version = "0.1.0"
description = "Sync Garmin fitness data to local exports and Fitnessd."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "garminconnect==0.3.5",
]

[dependency-groups]
dev = [
    "pre-commit>=4,<5",
]

[tool.uv]
constraint-dependencies = [
    "urllib3>=2.8.0",
    "virtualenv>=21.7.13",
]
