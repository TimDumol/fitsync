appId: com.fitsync.mobile.nativefixtures
name: Native authentication and navigation
---
- launchApp:
    clearState: true
- assertVisible:
    id: today-screen
- tapOn: Settings
- scrollUntilVisible:
    element:
      id: logout-button
    direction: DOWN
    centerElement: true
- tapOn:
    id: logout-button
- assertVisible:
    id: sign-in-screen
- tapOn:
    id: sign-in-button
- assertVisible:
    id: today-screen
