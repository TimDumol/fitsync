appId: com.fitsync.mobile.nativefixtures
name: Native history and deletion
---
- launchApp:
    clearState: true
- tapOn: History
- scrollUntilVisible:
    element:
      id: history-workout-row-00000000-0000-4000-8000-000000000015
    direction: DOWN
    centerElement: true
- tapOn:
    id: history-workout-row-00000000-0000-4000-8000-000000000015
- assertVisible:
    id: workout-summary-screen
- scrollUntilVisible:
    element:
      id: workout-summary-entry-1
    direction: DOWN
    centerElement: true
- assertVisible: ".*10 reps.*"
- assertVisible: ".*16 kg.*"
- scrollUntilVisible:
    element:
      id: delete-workout-button
    direction: UP
    centerElement: true
- tapOn:
    id: delete-workout-button
- tapOn: Delete
- assertVisible:
    id: history-screen
- assertNotVisible: Fixture completed workout
