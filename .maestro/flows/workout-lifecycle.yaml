appId: com.fitsync.mobile.nativefixtures
name: Native offline workout lifecycle
---
- launchApp:
    clearState: true
- scrollUntilVisible:
    element:
      id: start-workout-button
    direction: DOWN
    centerElement: true
- tapOn:
    id: start-workout-button
- scrollUntilVisible:
    element:
      id: session-start-workout-button
    direction: DOWN
    centerElement: true
- tapOn:
    id: session-start-workout-button
- tapOn:
    id: workout-entry-1-reps
- inputText: "10"
- tapOn:
    id: workout-entry-1-load
- inputText: "18"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: workout-entry-1-rest-button
    direction: DOWN
    centerElement: true
- tapOn:
    id: workout-entry-1-rest-button
- assertVisible:
    id: rest-timer
- tapOn:
    id: stop-rest-button
- tapOn:
    id: undo-rest-button
- assertVisible:
    id: rest-timer
- tapOn:
    id: stop-rest-button
- tapOn:
    id: add-set-button
- tapOn:
    id: add-unplanned-button
- tapOn:
    id: add-exercise-name
- inputText: "Cable curl"
- hideKeyboard
- tapOn:
    id: add-exercise-confirm
- scrollUntilVisible:
    element:
      id: workout-notes-input
    timeout: 60000
    direction: DOWN
    centerElement: false
- tapOn:
    id: workout-notes-input
- inputText: "Native Maestro note"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: finish-workout-button
    direction: DOWN
    centerElement: false
- tapOn:
    id: finish-workout-button
- assertVisible:
    id: workout-summary-screen
- assertVisible: Workout is pending sync.
