appId: com.fitsync.mobile.nativefixtures
name: Native Garmin MFA and import
---
- launchApp:
    clearState: true
- tapOn: Settings
- scrollUntilVisible:
    element:
      id: garmin-email
    direction: DOWN
    centerElement: true
- tapOn:
    id: garmin-email
- inputText: mfa
- hideKeyboard
- tapOn:
    id: garmin-password
- inputText: fixturepassword
- hideKeyboard
- scrollUntilVisible:
    element:
      id: connect-garmin-button
    direction: DOWN
    centerElement: true
- tapOn:
    id: connect-garmin-button
- assertVisible: Verify Garmin
- tapOn:
    id: garmin-mfa-code
- inputText: "123456"
- hideKeyboard
- tapOn:
    id: verify-garmin-button
- scrollUntilVisible:
    element:
      id: sync-garmin-button
    direction: DOWN
    centerElement: true
- tapOn:
    id: sync-garmin-button
- assertVisible:
    id: garmin-result
- scrollUntilVisible:
    element:
      id: disconnect-garmin-button
    direction: DOWN
    centerElement: true
- tapOn:
    id: disconnect-garmin-button
- tapOn: Disconnect
- assertNotVisible:
    id: garmin-connected
