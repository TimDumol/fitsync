appId: com.fitsync.mobile.nativefixtures
name: Native plan review and skip
---
- launchApp:
    clearState: true
- tapOn: Plan
- scrollUntilVisible:
    element:
      id: planned-session-row
    direction: DOWN
    centerElement: true
- tapOn:
    id: planned-session-row
- assertVisible:
    id: planned-session-screen
- scrollUntilVisible:
    element:
      id: session-skip-button
    direction: DOWN
    centerElement: true
- tapOn:
    id: session-skip-button
- scrollUntilVisible:
    element: ".*skipped.*"
    direction: UP
    centerElement: true
- assertVisible: ".*skipped.*"
